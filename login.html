<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Riego Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        if (localStorage.getItem('userId')) {
            window.location.replace('index.html');
        } else {
            fetch('https://riego-backend-nh42.onrender.com/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: 'warmup', password: 'warmup00' })
            }).catch(() => {});
        }
    </script>
</head>

<body class="auth-bg">
    <div class="auth-wrapper">
        <div class="card auth-card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-flower1 display-4 text-success"></i>
                    <h1 class="h4 fw-bold mt-2 mb-1">Riego Inteligente</h1>
                    <p class="text-muted small mb-0">Acceso al panel de control</p>
                </div>

                <div id="alert" class="d-none"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario</label>
                        <input type="text" class="form-control form-control-lg" id="username" autocomplete="username"
                            required minlength="4" maxlength="50">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="password"
                                autocomplete="current-password" required minlength="8" maxlength="100">
                            <button class="btn btn-outline-secondary" type="button" id="togglePass" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold" id="btnLogin">
                        <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
                        <span id="btnLoginText">Iniciar sesión</span>
                    </button>
                    <small id="loginHint" class="text-muted d-none d-block mt-2 text-center small"></small>
                </form>

                <div class="text-center mt-4">
                    <a href="forgot-password.html" class="text-decoration-none small">
                        <i class="bi bi-key me-1"></i>¿Olvidaste tu contraseña?
                    </a>
                </div>
            </div>
        </div>
        <p class="text-center text-muted small mt-3 mb-0">&copy; 2026 Riego Inteligente</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
