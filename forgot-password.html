<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña · Riego Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-bg">
    <div class="auth-wrapper">
        <div class="card auth-card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-envelope-lock display-4 text-success"></i>
                    <h1 class="h4 fw-bold mt-2 mb-1">Recuperar contraseña</h1>
                    <p class="text-muted small mb-0">Te enviaremos un enlace a tu correo registrado</p>
                </div>

                <div id="alert" class="d-none"></div>

                <form id="forgotForm" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Correo @gmail.com</label>
                        <input type="email" class="form-control form-control-lg" id="email"
                               placeholder="usuario@gmail.com" autocomplete="email" required maxlength="100">
                        <div class="form-text">El correo que el administrador registró para tu cuenta.</div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold" id="btnForgot">
                        <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
                        Enviar enlace de recuperación
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="login.html" class="text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
