<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña · Riego Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-bg">
    <div class="auth-wrapper">
        <div class="card auth-card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock display-4 text-success"></i>
                    <h1 class="h4 fw-bold mt-2 mb-1">Cambiar contraseña</h1>
                    <p class="text-muted small mb-0">Actualiza tu contraseña de acceso</p>
                </div>

                <div id="alert" class="d-none"></div>

                <form id="changeForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario</label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               autocomplete="username" required minlength="4" maxlength="50">
                    </div>

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold">Contraseña actual</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="currentPassword"
                                   autocomplete="current-password" required minlength="8" maxlength="100">
                            <button class="btn btn-outline-secondary" type="button" data-toggle="currentPassword" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold">Nueva contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-lg" id="newPassword"
                                   autocomplete="new-password" required minlength="8" maxlength="100">
                            <button class="btn btn-outline-secondary" type="button" data-toggle="newPassword" tabindex="-1">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirmar nueva contraseña</label>
                        <input type="password" class="form-control form-control-lg" id="confirmPassword"
                               autocomplete="new-password" required minlength="8" maxlength="100">
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-semibold" id="btnChange">
                        <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
                        Guardar nueva contraseña
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="login.html" class="text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
